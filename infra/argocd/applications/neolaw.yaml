apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neolaw
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:pakube999/neolaw.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: neolaw
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
