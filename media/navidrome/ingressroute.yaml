apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: navidrome
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`music.codexasystems.net`)
      kind: Rule
      services:
        - name: navidrome
          port: 4533
  tls:
    secretName: wildcard-codexasystems-net-tls
