apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`audiobooks.codexasystems.net`)
      kind: Rule
      services:
        - name: audiobookshelf-audiobookshelf
          port: 80
  tls:
    secretName: wildcard-codexasystems-net-tls
