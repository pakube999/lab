apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.codexasystems.net`)
      kind: Rule
      services:
        - name: prometheus-stack-grafana
          port: 4000
  tls:
    secretName: wildcard-codexasystems-net-tls
