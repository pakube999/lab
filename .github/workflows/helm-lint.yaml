name: Helm Lint & Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  helm-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Add Helm repos
        run: |
          helm repo add pajikos https://pajikos.github.io/home-assistant-helm-chart/
          helm repo add geek-cookbook https://geek-cookbook.github.io/charts/
          helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts/
          helm repo add oben01 https://oben01.github.io/charts/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add jameswynn https://jameswynn.github.io/helm-charts
          helm repo add sealed-secrets https://bitnami.github.io/sealed-secrets
          helm repo add jetstack https://charts.jetstack.io
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm repo add djjudas21 https://djjudas21.github.io/charts/
          helm repo update

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz && sudo mv kubeconform /usr/local/bin/

      - name: Validate Home Assistant manifests
        run: |
          helm template homeassistant pajikos/home-assistant \
            --namespace homeassistant \
            --values homeassistant/homeassistant-values.yaml \
            | kubeconform \
              --strict \
              --ignore-missing-schemas \
              --kubernetes-version 1.32.0
